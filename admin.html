<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific: orders table */
    .page-title {
      font-size: var(--text-xl);
      font-weight: 400;
    }

    .table-wrap {
      overflow-x: auto;
      border: var(--line-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 48rem;
      border-collapse: collapse;
      font-size: var(--text-sm);
      line-height: 1.7;
      text-align: left;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      vertical-align: top;
    }

    #ordersTable thead th {
      background: var(--cream);
      color: var(--ink);
      font-weight: 400;
      white-space: nowrap;
      border-bottom: var(--line);
    }

    #ordersTable tbody td {
      border-bottom: var(--line-soft);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background: rgba(228, 217, 198, 0.25);
    }

    /* date and total stay on one line; items and note may wrap */
    #ordersTable td:nth-child(1),
    #ordersTable td:nth-child(5) {
      white-space: nowrap;
    }

    #ordersTable td:nth-child(5) {
      color: var(--bronze-deep);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <span class="rule" aria-hidden="true"></span>
          <p>เรียงจากรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
