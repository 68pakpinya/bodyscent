<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณที่สั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific: centered thank-you message */
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      text-align: center;
    }
    .thanks .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .thanks h1 {
      font-size: var(--text-xl);
      font-weight: 400;
    }
    .thanks p {
      margin-inline: auto;
      margin-bottom: var(--space-4);
    }
    @media (max-width: 40rem) {
      .thanks { min-height: calc(100svh - 4rem); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="thanks">
    <div class="container">
      <h1>ขอบคุณที่สั่งซื้อ</h1>
      <span class="rule" aria-hidden="true"></span>
      <p>เราได้รับคำสั่งซื้อของคุณแล้ว และจะติดต่อกลับทางเบอร์โทรหรือ Line ที่ให้ไว้เพื่อยืนยันรายการ</p>
      <a class="btn" href="index.html">กลับหน้าแรก</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <p>เลือกกลิ่นให้ตรงกับอารมณ์ของคุณในทุกวัน</p>
    </div>
  </footer>

</body>
</html>
